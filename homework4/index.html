<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='index.css'>
    <script src='main.js'></script>
</head>
<body>
    <form>
        <fieldset>
            <h2>Ваши личные данные</h2>
            <label for="">
                <h4>Ваше имя</h4>
                <input type="text" placeholder="Имя" required>
            </label>
            <label for="">
                <h4>Ваш возраст</h4>
                <input type="number" placeholder="Возраст" inputmode="numeric" required>
            </label>
            <label for="">
                <h4>Ваш номер телефона</h4>
                <input type="tel" placeholder="Номер телефона" inputmode="tel" required>
            </label>
            <label for="">
                <h4>Ваша почта</h4>
                <input type="text" placeholder="Почта" inputmode="email" required>
            </label>
            <label for="">
                <h4>Сообщение</h4>
                <textarea type="text" placeholder="Ваше сообщение" required></textarea>
            </label>
            <div></div>
            <label  for="">
                <input class="checkbox" type="checkbox"   required>
                Я принемаю правила
            </label>
            <button type="submit">Отправить</button>
        </fieldset>
        
    </form>
</body>
</html>
